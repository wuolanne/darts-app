<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DartsFlow</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #151b23;
        --text: #f3f6fb;
        --muted: #a8b3c7;
        --accent: #66c18c;
        --border: #2a3342;
      }

      body {
        margin: 0;
        font-family: Inter, Segoe UI, Arial, sans-serif;
        background: linear-gradient(180deg, #10141b, #0b0f14);
        color: var(--text);
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 20px 72px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 10px;
      }

      p {
        color: var(--muted);
        line-height: 1.65;
      }

      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>DartsFlow</h1>
        <p>Checkout practice app for darts players</p>
        <p><a href="./privacy-policy.html">Privacy Policy</a></p>
        <p>Support: dartsflow@gmail.com</p>
      </section>
    </main>
  </body>
</html>
